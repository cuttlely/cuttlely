name: Release image

on:
    push:
        tags:
            - 'v*.*.*'
            - 'ci-dryrun-*'
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to build; empty uses the ref that started the run
                required: false
                default: ''
                type: string
            tag:
                description: Image tag beginning with ci- or an X.Y.Z-rc.N tag
                required: true
                type: string

permissions:
    contents: read
    packages: write

concurrency:
    group: release-image-${{ github.ref }}
    cancel-in-progress: false

jobs:
    image:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref || github.ref }}
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - name: Plan image tags and labels
              id: plan
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REF_VALUE: ${{ github.ref }}
                  INPUT_TAG: ${{ inputs.tag }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  node --input-type=module <<'NODE'
                  import { appendFileSync, readFileSync } from 'node:fs'
                  import { execFileSync } from 'node:child_process'
                  import { ciImagePlan, defaultImage } from './scripts/release.mjs'

                  const slug = process.env.REPOSITORY
                  const plan = ciImagePlan({
                      event: process.env.EVENT_NAME,
                      ref: process.env.REF_VALUE,
                      inputTag: process.env.INPUT_TAG,
                      packageVersion: JSON.parse(readFileSync('package.json', 'utf8')).version,
                      sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
                      slug,
                      created: new Date().toISOString(),
                      image: defaultImage(slug)
                  })
                  if (plan.errors.length) {
                      for (const error of plan.errors) console.error(error)
                      process.exit(1)
                  }
                  const output = (name, value) => {
                      const marker = `CUTTLELY_${name.toUpperCase()}`
                      appendFileSync(process.env.GITHUB_OUTPUT, `${name}<<${marker}\n${value}\n${marker}\n`)
                  }
                  output('image', plan.image)
                  output('tags', plan.tags.join('\n'))
                  output('tag_names', plan.tagNames.join('\n'))
                  output('labels', Object.entries(plan.labels).map(([name, value]) => `${name}=${value}`).join('\n'))
                  output('latest', String(plan.latest))
                  output('mode', plan.mode)
                  output('version', plan.version)
                  NODE
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.plan.outputs.tags }}
                  labels: ${{ steps.plan.outputs.labels }}
                  cache-from: type=gha,scope=release-image
                  cache-to: type=gha,mode=max,scope=release-image
                  provenance: mode=max
                  sbom: true
            - name: Inspect pushed image
              env:
                  IMAGE: ${{ steps.plan.outputs.image }}
                  TAG_NAMES: ${{ steps.plan.outputs.tag_names }}
                  PUSHED_LATEST: ${{ steps.plan.outputs.latest }}
                  VERSION_TAG: ${{ steps.plan.outputs.version }}
                  BUILD_DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  declare -A digests
                  {
                    echo '## Release image'
                    echo
                    echo "Build digest: \`$BUILD_DIGEST\`"
                    echo
                    echo '| Tag | Digest | Platforms |'
                    echo '| --- | --- | --- |'
                  } >> "$GITHUB_STEP_SUMMARY"
                  while IFS= read -r tag; do
                    [ -n "$tag" ] || continue
                    ref="$IMAGE:$tag"
                    inspection="$(docker buildx imagetools inspect "$ref")"
                    printf '%s\n' "$inspection"
                    digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" { print $2; exit }')"
                    platforms="$(printf '%s\n' "$inspection" | awk '$1 == "Platform:" && $2 != "unknown/unknown" { print $2 }' | sort -u | paste -sd, -)"
                    [ -n "$digest" ] || { echo "No digest reported for $ref" >&2; exit 1; }
                    [ -n "$platforms" ] || platforms='not reported'
                    digests["$tag"]="$digest"
                    echo "| \`$tag\` | \`$digest\` | $platforms |" >> "$GITHUB_STEP_SUMMARY"
                  done <<< "$TAG_NAMES"
                  if [ "$PUSHED_LATEST" = 'true' ] && [ "${digests[latest]}" != "${digests[$VERSION_TAG]}" ]; then
                    echo "latest digest ${digests[latest]} does not match $VERSION_TAG digest ${digests[$VERSION_TAG]}" >&2
                    exit 1
                  fi
