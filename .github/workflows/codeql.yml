name: CodeQL
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '29 4 * * 1'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    # Uploads are refused while the repository's CodeQL default setup is on; switch it to advanced first.
    # C and C++ are not analyzed: the only C and C++ files are under hermes/, which codeql-config.yml leaves out.
    # The hermes-patches entry scans only the hermes/ files Cuttlely's patches touch, copied out of a checkout in repo/.
    analyze:
        name: Analyze (${{ matrix.category }})
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: actions
                      config: ./.github/codeql/codeql-config.yml
                      category: /language:actions
                    - language: javascript-typescript
                      config: ./.github/codeql/codeql-config.yml
                      category: /language:javascript-typescript
                    - language: python
                      config: ./.github/codeql/codeql-config.yml
                      category: /language:python
                    - language: python
                      config: ./repo/.github/codeql/codeql-hermes-patches.yml
                      category: /language:python/hermes-patches
                      checkout-path: repo
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: ${{ matrix.checkout-path }}
            # CodeQL extracts from the workspace root, so the patched files are copied there and the checkout sits beside them.
            - name: Copy the patched hermes files to the workspace root
              if: matrix.checkout-path
              working-directory: ${{ matrix.checkout-path }}
              run: |
                  while read -r file; do cp --parents "$file" "$GITHUB_WORKSPACE/"; done < .github/codeql/hermes-patched-files.txt
                  find "$GITHUB_WORKSPACE/hermes" -type f | sort
            - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  config-file: ${{ matrix.config }}
            - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  category: ${{ matrix.category }}
                  checkout_path: ${{ github.workspace }}/${{ matrix.checkout-path }}
