name: CodeQL
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '29 4 * * 1'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    # Uploads are refused while the repository's CodeQL default setup is on; switch it to advanced first.
    # C and C++ are not analyzed: the only C and C++ files are under hermes/, which codeql-config.yml leaves out.
    # The hermes-patches entry scans the hermes/ files Cuttlely's patches touch, copied into their own source root.
    analyze:
        name: Analyze (${{ matrix.category }})
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: actions
                      config: ./.github/codeql/codeql-config.yml
                      category: /language:actions
                    - language: javascript-typescript
                      config: ./.github/codeql/codeql-config.yml
                      category: /language:javascript-typescript
                    - language: python
                      config: ./.github/codeql/codeql-config.yml
                      category: /language:python
                    - language: python
                      config: ./.github/codeql/codeql-hermes-patches.yml
                      category: /language:python/hermes-patches
                      source-root: codeql-hermes-patches
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - name: Copy the patched hermes files into their own source root
              if: matrix.source-root
              env:
                  SOURCE_ROOT: ${{ matrix.source-root }}
              run: |
                  mkdir "$SOURCE_ROOT"
                  while read -r file; do cp --parents "$file" "$SOURCE_ROOT/"; done < .github/codeql/hermes-patched-files.txt
                  find "$SOURCE_ROOT" -type f | sort
            - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  config-file: ${{ matrix.config }}
                  source-root: ${{ matrix.source-root }}
            - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  category: ${{ matrix.category }}
