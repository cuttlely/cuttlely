name: CodeQL
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: '29 4 * * 1'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    # Uploads are refused while the repository's CodeQL default setup is on; switch it to advanced first.
    # C and C++ are not analyzed: the only C and C++ files are under hermes/, which the config leaves out.
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [actions, javascript-typescript, python]
        steps:
            - uses: actions/checkout@v6
            - uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  config-file: ./.github/codeql/codeql-config.yml
            - uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:${{ matrix.language }}'
