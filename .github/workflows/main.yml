name: Node CI
on:
    pull_request:
        branches:
            - '**'
        types: [opened, synchronize, reopened, ready_for_review, edited]
    schedule:
        # Daily full run on main (UTC). There are no push-to-main runs.
        - cron: '17 9 * * *'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Superseded PR runs are cancelled; scheduled and manual runs on main never are.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    # Every pnpm/action-setup step takes the pnpm version from packageManager in package.json.
    # Cheap and required: runs on every PR push, drafts included, and on the daily run.
    # The proprietary path check runs only here, because lint is the required status check.
    lint:
        runs-on: ubuntu-latest
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
        steps:
            - uses: actions/checkout@v7
              with:
                  # On a pull request HEAD is the merge commit, and HEAD^1 is the base it is diffed against.
                  fetch-depth: 2
            - name: proprietary paths
              run: node scripts/proprietary-paths.mjs ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}
            - name: media size
              run: node scripts/media-size.mjs
            # Checked-in list in scripts/pr-text-banned.mjs. Not PR_TEXT_BANNED, not a secret.
            # fetch-depth stays 2: this step reads the pull request title and body only.
            # pull_request.types includes edited so a title or body change is checked again.
            - name: PR text banned words
              if: github.event_name == 'pull_request'
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: node scripts/pr-text-banned.mjs
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24.15.0
              uses: actions/setup-node@v7
              with:
                  node-version: 24.15.0
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - name: boundaries
              run: node scripts/check-boundaries.mjs && node --test scripts/check-boundaries.test.mjs
            - run: pnpm install
            - run: pnpm lint

    # Decides whether build, cypress (and docker-build in its workflow) are needed: false only for a ready PR whose
    # changes are all docs (*.md, .projects/**); a mixed diff runs everything. Job-level `if:` only, never workflow-level
    # `paths` filters, so required checks always report. lint never depends on it.
    # Nothing in build, unit tests or Cypress reads .projects/** or *.md (checked with rg); root lint does lint *.md.
    changes:
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.diff.outputs.code }}
        steps:
            # The PR merge commit's first parent is the base, so HEAD^1..HEAD is exactly this PR's change set.
            # Trees only (blob:none, sparse .github): a few seconds.
            - uses: actions/checkout@v7
              if: github.event_name == 'pull_request'
              with:
                  fetch-depth: 2
                  filter: blob:none
                  sparse-checkout: .github
            - name: Detect code changes
              id: diff
              env:
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  if [ "$EVENT_NAME" != "pull_request" ]; then
                    echo "code=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if ! files=$(git diff --name-only HEAD^1 HEAD); then
                    echo "Could not diff the merge commit; running everything."
                    echo "code=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "Changed files:"
                  echo "$files" | head -100 | sed 's/^/  /'
                  code=$(echo "$files" | grep -Ev '(\.md$|^\.projects/)' | grep -c . || true)
                  if [ "$code" -gt 0 ] || [ -z "$files" ]; then
                    echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Docs-only change; build and test are skipped."
                    echo "code=false" >> "$GITHUB_OUTPUT"
                  fi

    # Website build and link check (website/scripts/check-site.mjs, run by npm run build, the same
    # command as website/render.yaml). Runs on every PR and the daily run: the site reads docs/ and root
    # markdown, so a broken link or anchor there fails the PR instead of the live site build.
    check-site:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.15.0
              uses: actions/setup-node@v7
              with:
                  node-version: 24.15.0
                  cache: 'npm'
                  cache-dependency-path: website/package-lock.json
            - name: Build the website and check links
              run: cd website && npm ci && npm run build

    # Build and unit tests (required): ready (non-draft) PRs and the daily run only.
    # The fixed name keeps the check name "build (ubuntu-latest, 24.15.0)" whether the job runs or is skipped
    # (a skipped matrix job would report as plain "build").
    build:
        name: build (ubuntu-latest, 24.15.0)
        needs: changes
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
        # Throwaway database for the live Postgres tests in packages/server/src/identity (sqlStore, auditLog). They
        # connect to 127.0.0.1:5432 as postgres and skip without PGPASSWORD.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24.15.0
              uses: actions/setup-node@v7
              with:
                  node-version: 24.15.0
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - run: pnpm install
            - run: pnpm build
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
            - run: pnpm harness:check
            - run: pnpm etl:check
            - run: pnpm test:coverage
              env:
                  PGPASSWORD: postgres
            # Fails if the live Postgres session test was skipped instead of run.
            - name: Live Postgres session test ran
              working-directory: packages/server
              env:
                  PGPASSWORD: postgres
              run: |
                  npx jest src/identity/sqlStore.test.ts --json --outputFile="$RUNNER_TEMP/pg-session.json"
                  node -e "const r=require(process.argv[1]); console.log('passed', r.numPassedTests, 'skipped', r.numPendingTests); if (r.numPendingTests !== 0 || r.numPassedTests < 1) process.exit(1)" "$RUNNER_TEMP/pg-session.json"
            # Report only. These numbers do not fail the job.
            - name: Health report
              if: always()
              continue-on-error: true
              run: node scripts/health-report.mjs

    # npx CLI (required by the Node 20 fix): the CLI's unit tests, including the start path's health wait with
    # simulated connection resets and a never-settling fetch in a fresh process, on every Node the CLI supports
    # (package.json engines ">=20"). No install: the CLI has no dependencies.
    cli-node:
        name: cli-node (${{ matrix.node }})
        needs: changes
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['20', '22', '24.15.0']
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
            - name: CLI tests
              working-directory: packages/cli
              run: node --version && node --test test/cli.test.js

    # Analyst table selection against every supported Postgres major (advisory): same gating as build. The scope
    # check reads Postgres query trees and catalogs, so each major runs the selection tests and parity corpus.
    # CUTTLELY_TEST_PG_REQUIRED fails the run instead of skipping when the service is not reachable. The case that
    # loads the built node skips here, because this job does not build; the build job's verify covers it.
    analyst-postgres:
        name: analyst-postgres (${{ matrix.postgres }})
        needs: changes
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                postgres: ['14', '15', '16', '17', '18']
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
        services:
            postgres:
                image: postgres:${{ matrix.postgres }}
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24.15.0
              uses: actions/setup-node@v7
              with:
                  node-version: 24.15.0
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - run: pnpm install
            - name: Analyst table selection tests
              env:
                  PGPASSWORD: postgres
                  CUTTLELY_TEST_PG_REQUIRED: '1'
              run: node --test scripts/analyst-relations.test.mjs scripts/analyst-guard-parity.test.mjs
            - name: Analyst table selection tests (old round trips)
              env:
                  PGPASSWORD: postgres
                  CUTTLELY_TEST_PG_REQUIRED: '1'
                  CUTTLELY_TEST_GUARD_LEGACY_ROUND_TRIPS: '1'
              run: node --test scripts/analyst-relations.test.mjs
            - name: Analyst tests for a login that defaults to read-only transactions
              env:
                  PGPASSWORD: postgres
                  CUTTLELY_TEST_PG_REQUIRED: '1'
              run: node --test scripts/analyst-readonly-role.test.mjs
            - name: Analyst pinned query tests
              env:
                  PGPASSWORD: postgres
                  CUTTLELY_TEST_PG_REQUIRED: '1'
              run: node --test scripts/analyst-pinned.test.mjs
            - name: PostgreSQL node pinned query tests
              env:
                  PGPASSWORD: postgres
                  CUTTLELY_TEST_PG_REQUIRED: '1'
                  CUTTLELY_TEST_PG_URL: postgres://postgres@localhost:5432/postgres
              run: pnpm --filter @cuttlely/components test:pinned
            - name: Invite sign-in tests
              env:
                  PGPASSWORD: postgres
                  CUTTLELY_TEST_PG_REQUIRED: '1'
              run: pnpm --filter @cuttlely/server exec jest --verbose src/identity/inviteSignIn.test.ts src/identity/sqlStore.test.ts src/identity/scimPostgres.test.ts

    # Cypress end-to-end (advisory, not in the required set): same gating as build. Its own job so a Cypress failure
    # shows as a red "cypress" check without blocking the merge.
    cypress:
        name: cypress
        needs: changes
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24.15.0
              uses: actions/setup-node@v7
              with:
                  node-version: 24.15.0
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - run: pnpm install
            - run: pnpm build
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
            - name: Cypress install
              run: pnpm cypress install
            - name: Install dependencies (Cypress Action)
              uses: cypress-io/github-action@v7.4.6
              with:
                  working-directory: ./
                  runTests: false
            - name: Cypress test
              uses: cypress-io/github-action@v7.4.6
              with:
                  install: false
                  working-directory: packages/server
                  start: pnpm start
                  wait-on: 'http://localhost:3000'
                  wait-on-timeout: 120
                  browser: chrome

    # Queue mode end to end (advisory): the daily run and manual runs on main only, never on pull requests. Starts a
    # server and a worker against the Redis service, stops a streaming prediction partway and checks the worker stops
    # the run and saves no messages (scripts/queue-abort-e2e.mjs). Placeholder model, no secrets.
    queue-abort:
        name: queue-abort
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - name: Use Node.js 24.15.0
              uses: actions/setup-node@v7
              with:
                  node-version: 24.15.0
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'
            - run: pnpm install
            - run: pnpm build
              env:
                  NODE_OPTIONS: '--max_old_space_size=4096'
            - run: pnpm test:queue-abort
              env:
                  REDIS_URL: redis://localhost:6379
