name: Release preparation

on:
    pull_request:
        paths:
            - '.github/workflows/release-prepare.yml'
            - 'scripts/release.mjs'
    workflow_dispatch:
        inputs:
            version:
                description: Exact release version to prepare
                required: true
                default: '1.7.6'
                type: string
            prepare:
                description: Prepare a local release on main; false only verifies the selected ref
                required: true
                default: true
                type: boolean

permissions:
    contents: read

concurrency:
    group: release-preparation-${{ github.ref }}
    cancel-in-progress: false

env:
    PUPPETEER_SKIP_DOWNLOAD: true
    GIT_TERMINAL_PROMPT: '0'
    SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
    verify:
        if: github.event_name == 'pull_request' || !inputs.prepare
        runs-on: ubuntu-latest
        timeout-minutes: 60
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.SOURCE_SHA }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.15.0
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Run the complete verification gate
              run: pnpm verify
              env:
                  PGPASSWORD: postgres
            - name: Keep the exact-head verification report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-verification-${{ env.SOURCE_SHA }}
                  path: .verify/verify-report.json
                  if-no-files-found: warn
                  retention-days: 7

    prepare:
        if: github.event_name == 'workflow_dispatch' && inputs.prepare && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            RELEASE_VERSION: ${{ inputs.version }}
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false
            - name: Free runner disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
                  df -h /
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.15.0
                  cache: pnpm
            - name: Validate the version and source
              run: |
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict'
                  import { execFileSync } from 'node:child_process'
                  import { parseSemver } from './scripts/release.mjs'
                  assert.ok(parseSemver(process.env.RELEASE_VERSION), 'An exact semantic version is required')
                  assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), process.env.SOURCE_SHA)
                  NODE
            - run: pnpm install --frozen-lockfile
            - name: Configure the local release author
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            - name: Verify and prepare locally without publication
              run: pnpm release "$RELEASE_VERSION" --local
              env:
                  PGPASSWORD: postgres
            - name: Validate and export the prepared release
              run: |
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict'
                  import { execFileSync } from 'node:child_process'
                  import { mkdirSync, readFileSync, writeFileSync, copyFileSync } from 'node:fs'
                  import path from 'node:path'
                  const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
                  const source = process.env.SOURCE_SHA
                  const version = process.env.RELEASE_VERSION
                  const tag = `v${version}`
                  const report = JSON.parse(readFileSync('.verify/verify-report.json', 'utf8'))
                  assert.equal(report.head, source)
                  assert.equal(report.mode, 'full')
                  assert.equal(report.ok, true)
                  assert.equal(git('cat-file', '-t', tag), 'tag')
                  const release = git('rev-parse', `${tag}^{commit}`)
                  assert.equal(git('rev-parse', 'HEAD'), release)
                  assert.equal(git('rev-parse', `${release}^`), source)
                  assert.equal(git('status', '--porcelain'), '')
                  const manifests = ['package.json', 'packages/server/package.json', 'packages/cli/package.json', 'packages/chat-widget/package.json']
                  for (const file of manifests) assert.equal(JSON.parse(readFileSync(file, 'utf8')).version, version)
                  const changed = git('diff', '--name-only', source, release).split('\n').filter(Boolean).sort()
                  const { checkVersionConsistency, RELEASE_DOC_FILES, releaseDocText } = await import('./scripts/version-consistency.mjs')
                  const previous = JSON.parse(git('show', `${source}:package.json`)).version
                  for (const file of RELEASE_DOC_FILES) {
                      const before = execFileSync('git', ['show', `${source}:${file}`], { encoding: 'utf8' })
                      assert.equal(readFileSync(file, 'utf8'), releaseDocText(file, before, previous, version), `Unexpected release edit to ${file}`)
                  }
                  assert.deepEqual(checkVersionConsistency().errors, [])
                  const allowed = new Set([...manifests, ...RELEASE_DOC_FILES, 'CHANGELOG.md'])
                  assert.ok(changed.includes('CHANGELOG.md'))
                  assert.ok(changed.every(file => allowed.has(file)), 'Unexpected files in the release commit')
                  const output = path.join(process.env.RUNNER_TEMP, 'release-preparation')
                  mkdirSync(output, { recursive: true })
                  git('bundle', 'create', path.join(output, 'release.bundle'), `refs/tags/${tag}`, `^${source}`)
                  writeFileSync(path.join(output, 'metadata.json'), JSON.stringify({ version, source, release, tag, tagObject: git('rev-parse', tag), localImageChecked: true, node: process.version }, null, 2) + '\n')
                  copyFileSync('.verify/verify-report.json', path.join(output, 'verify-report.json'))
                  NODE
            - name: Upload the verified local release
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release-preparation-${{ inputs.version }}
                  path: ${{ runner.temp }}/release-preparation
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 7
