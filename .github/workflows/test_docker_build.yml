name: Test Docker Build

on:
    pull_request:
        branches:
            - '**'
        types: [opened, synchronize, reopened, ready_for_review]
    schedule:
        # Daily full run on main (UTC). There are no push-to-main runs.
        - cron: '17 9 * * *'
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Superseded PR runs are cancelled; scheduled and manual runs on main never are.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    # Same docs-only rule as Node CI's changes job.
    changes:
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.diff.outputs.code }}
        steps:
            # The PR merge commit's first parent is the base, so HEAD^1..HEAD is exactly this PR's change set.
            # Trees only (blob:none, sparse .github): a few seconds.
            - uses: actions/checkout@v7
              if: github.event_name == 'pull_request'
              with:
                  fetch-depth: 2
                  filter: blob:none
                  sparse-checkout: .github
            - name: Detect code changes
              id: diff
              env:
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  if [ "$EVENT_NAME" != "pull_request" ]; then
                    echo "code=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if ! files=$(git diff --name-only HEAD^1 HEAD); then
                    echo "Could not diff the merge commit; running everything."
                    echo "code=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  code=$(echo "$files" | grep -Ev '(\.md$|^\.projects/)' | grep -c . || true)
                  if [ "$code" -gt 0 ] || [ -z "$files" ]; then
                    echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Docs-only change; the Docker build is skipped."
                    echo "code=false" >> "$GITHUB_OUTPUT"
                  fi

    # Ready (non-draft) PRs, including pull requests into main, and the daily run only. Check name "docker-build",
    # whether it runs or is skipped; the name no longer collides with Node CI's build check.
    docker-build:
        name: docker-build
        needs: changes
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        env:
            PUPPETEER_SKIP_DOWNLOAD: true
        # Throwaway database for the boot check below. It lives only for this job and holds no real data.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: cuttlely
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            - run: docker build --no-cache -t cuttlely .
            - name: Image and file libraries smoke test
              run: docker run --rm --entrypoint bash -e HERMES_ASSETS_REQUIRE_SYSTEM=1 cuttlely -c 'hermes/.venv/bin/python scripts/hermes-assets/smoke.py /tmp/hermes-assets-smoke'
            - name: Assets style kit tests
              run: docker run --rm --entrypoint bash cuttlely -c 'hermes/.venv/bin/python packages/harness/presets/assets/test_cuttlely_assets.py'
            - name: Analyst chat scope and schema refresh through the runtime's MCP handler
              run: docker run --rm --entrypoint bash -e CUTTLELY_REQUIRE_HERMES_RUNTIME=1 cuttlely -c 'node --test scripts/hermes-analyst-scope.test.mjs scripts/hermes-mcp-schema-refresh.test.mjs'
            # Start the built image the way a deploy runs it, on Postgres instead of the default SQLite file, and wait
            # until /api/v1/ping answers pong. Host networking lets the container reach the service on 127.0.0.1:5432.
            - name: Boot the image on Postgres and wait for ping
              run: |
                  docker run -d --name cuttlely-boot --network host \
                    -e CUTTLELY_LOCAL_ADMIN=false \
                    -e DATABASE_TYPE=postgres -e DATABASE_HOST=127.0.0.1 -e DATABASE_PORT=5432 \
                    -e DATABASE_NAME=cuttlely -e DATABASE_USER=postgres -e DATABASE_PASSWORD=postgres \
                    cuttlely
                  for _ in $(seq 120); do
                    if out=$(curl -fsS http://127.0.0.1:43117/api/v1/ping 2>/dev/null) && [[ "$out" == *pong* ]]; then
                      echo "$out"
                      exit 0
                    fi
                    if [ "$(docker inspect -f '{{.State.Running}}' cuttlely-boot)" != "true" ]; then
                      echo "The container stopped before it answered ping."
                      break
                    fi
                    sleep 3
                  done
                  echo "The image did not answer /api/v1/ping on Postgres within 6 minutes."
                  docker logs --tail 80 cuttlely-boot
                  exit 1
            - name: Remove the boot check container
              if: always()
              run: docker rm -f cuttlely-boot || true
            - name: Use Node.js 24.15.0
              id: node
              continue-on-error: true
              uses: actions/setup-node@v7
              with:
                  node-version: 24.15.0
            # Report only. A missing size, or a Node setup that did not succeed, does not fail the image build.
            - name: Health report
              if: always() && steps.node.outcome == 'success'
              continue-on-error: true
              run: node scripts/health-report.mjs --image cuttlely
