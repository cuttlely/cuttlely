<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Rosa's Bakery helper</title>
        <style>
            body {
                font: 16px/1.5 system-ui, sans-serif;
                max-width: 640px;
                margin: 40px auto;
                padding: 0 16px;
                color: #1f2328;
            }
            h1 {
                font-size: 24px;
                margin-bottom: 4px;
            }
            p.lead {
                color: #59636e;
                margin-top: 0;
            }
            #log {
                border: 1px solid #d1d9e0;
                border-radius: 8px;
                padding: 12px 16px;
                min-height: 160px;
            }
            .q {
                font-weight: 600;
                margin: 12px 0 4px;
            }
            .a {
                white-space: pre-wrap;
                margin: 0 0 8px;
            }
            .row {
                display: flex;
                gap: 8px;
                margin-top: 12px;
            }
            input {
                flex: 1;
                font: inherit;
                padding: 8px 10px;
                border: 1px solid #d1d9e0;
                border-radius: 6px;
            }
            button {
                font: inherit;
                padding: 8px 16px;
                border: 0;
                border-radius: 6px;
                background: #1f6feb;
                color: #fff;
                cursor: pointer;
            }
            button:disabled {
                background: #8c959f;
                cursor: default;
            }
            .error {
                color: #d1242f;
            }
        </style>
    </head>
    <body>
        <h1>Rosa's Bakery helper</h1>
        <p class="lead">Ask about opening hours, bread and cakes. Answers come from a Cuttlely flow.</p>
        <div id="log" aria-live="polite"></div>
        <div class="row">
            <input id="question" placeholder="What time do you open on Saturday?" autocomplete="off" />
            <button id="ask">Ask</button>
        </div>
        <script src="/app.js"></script>
    </body>
</html>
